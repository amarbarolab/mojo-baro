[package]
name = "baro-serve"
version = "0.1.0"
edition = "2021"
description = "OpenAI-compatible HTTP front for the mojo-baro engine (serve/engine.mojo, BARO_SERVE=1)"
license = "MIT"
publish = false

[[bin]]
name = "baro-serve"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "signal", "net", "time"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-core = "0.3"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
minijinja = { version = "2", features = ["loader", "json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

[profile.release]
opt-level = 2
