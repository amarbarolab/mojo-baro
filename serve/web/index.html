<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>baro</title>
  <link rel="manifest" href="/web/manifest.webmanifest">
  <link rel="icon" href="/web/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/web/icons/icon.svg">
  <meta name="theme-color" content="#1b1f27">
  <link rel="stylesheet" href="/web/app.css">
</head>
<body>
  <header>
    <button id="settings-btn" class="icon-btn" aria-label="Settings" type="button">&#9881;</button>
    <h1 id="model-name">baro</h1>
    <button id="new-chat-btn" class="icon-btn" aria-label="New chat" type="button">&#10133;</button>
  </header>

  <main id="messages" data-role="message-list">
    <p class="empty" id="empty-hint">No conversation yet. Say something.</p>
  </main>

  <form id="composer" autocomplete="off">
    <button id="mic" class="icon-btn" type="button" aria-label="Voice input" hidden>&#127908;</button>
    <textarea id="message-input" rows="1" placeholder="Message" required></textarea>
    <button id="send-button" type="submit" aria-label="Send">&#10148;</button>
  </form>

  <div id="settings-backdrop" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-label="Settings">
      <h2>Settings</h2>

      <div class="field">
        <label for="server-url">Server address</label>
        <input id="server-address" type="text" placeholder="http://127.0.0.1:8080" inputmode="url">
      </div>

      <div class="field">
        <label for="temperature">Temperature <span id="temperature-val">0.7</span></label>
        <input id="temperature" type="range" min="0" max="2" step="0.1" value="0.7">
      </div>

      <div class="field">
        <label for="max-tokens">Max tokens</label>
        <input id="max-tokens" type="number" min="1" max="8192" value="512">
      </div>

      <div class="field">
        <label for="system-prompt">System prompt</label>
        <textarea id="system-prompt" placeholder="Optional"></textarea>
      </div>

      <div class="field disabled">
        <label>Pair with another device <span class="badge">soon</span></label>
        <button type="button" id="pair-btn" disabled>Pair</button>
      </div>

      <div class="row-buttons">
        <button type="button" id="settings-close">Close</button>
        <button type="button" id="settings-clear" class="primary">Clear conversation</button>
      </div>
    </div>
  </div>

  <script src="/web/app.js" defer></script>
</body>
</html>
