name: Bug report
description: Wrong output, a crash, or a gate that lies
title: "[bug] <one line>"
labels: ["bug"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: What happened, and what you expected
      description: The exact error text or the wrong tokens. One symptom per issue.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest reproduction
      description: The command, the model or pack, and the request (token ids beat prompt text).
      render: sh
    validations:
      required: true
  - type: textarea
    id: arm
    attributes:
      label: Arm receipt
      description: Card, ROCm version, commit (`git rev-parse --short HEAD`), and the engine's startup echo lines (`BARO_*:` and the ready line).
      render: text
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Where it shows
      options:
        - engine output (tokens, logits)
        - serving layer (HTTP, streaming, router)
        - import or bake pipeline
        - a bench or gate script
        - build
    validations:
      required: true
  - type: textarea
    id: unverified
    attributes:
      label: What you did not check
      description: For example "did not try the replay path (BARO_PREFILL=0)".
